<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle Circuit / Matrix Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#grid)" />
  </g>

  <!-- Glow Blobs -->
  <circle cx="150" cy="120" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1130" cy="520" r="180" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="150" r="120" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Badges / Metadata -->
  <g transform="translate(80, 75)">
    <!-- Hugging Face Badge -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="22" fill="#fbbf24" class="sans" font-size="14" font-weight="600">🤗 Hugging Face Dataset</text>

    <!-- Verification Level Badge -->
    <rect x="205" y="0" width="220" height="34" rx="17" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="225" cy="17" r="5" fill="#34d399"/>
    <text x="238" y="22" fill="#a7f3d0" class="sans" font-size="14" font-weight="600">100% Native Executed</text>

    <!-- Toolchain Badge -->
    <rect x="440" y="0" width="240" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="455" y="22" fill="#94a3b8" class="mono" font-size="13">gcc 12.3 / g++ 12.3 + ASan</text>
  </g>

  <!-- Main Title & Branding -->
  <g transform="translate(80, 175)">
    <text x="0" y="0" fill="url(#accentGrad)" class="sans" font-size="44" font-weight="800" letter-spacing="-1px">
      Nemotron-3-Ultra-550B-Systems-CoT
    </text>
    <text x="0" y="44" fill="#cbd5e1" class="sans" font-size="22" font-weight="400">
      7-Agent Compiler-Verified Chain-of-Thought Dataset &amp; Multi-Silicon Benchmark
    </text>
  </g>

  <!-- 4 Metrics Cards -->
  <g transform="translate(80, 280)">
    <!-- Card 1: Verified Rows -->
    <rect x="0" y="0" width="260" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="42" fill="#38bdf8" class="sans" font-size="15" font-weight="600" text-transform="uppercase" letter-spacing="1px">Verified Split</text>
    <text x="24" y="95" fill="#f8fafc" class="sans" font-size="46" font-weight="800">36</text>
    <text x="88" y="90" fill="#64748b" class="sans" font-size="18">/ 134</text>
    <text x="24" y="126" fill="#10b981" class="mono" font-size="12">✓ 100% Native ASan/UBSan</text>

    <!-- Card 2: Full Benchmark -->
    <rect x="284" y="0" width="260" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="308" y="42" fill="#818cf8" class="sans" font-size="15" font-weight="600" text-transform="uppercase" letter-spacing="1px">Task Families</text>
    <text x="308" y="95" fill="#f8fafc" class="sans" font-size="46" font-weight="800">40</text>
    <text x="368" y="90" fill="#64748b" class="sans" font-size="18">/ 40</text>
    <text x="308" y="126" fill="#94a3b8" class="mono" font-size="12">134 Deduplicated Rows</text>

    <!-- Card 3: Evaluated Silicon -->
    <rect x="568" y="0" width="260" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="592" y="42" fill="#c084fc" class="sans" font-size="15" font-weight="600" text-transform="uppercase" letter-spacing="1px">Silicon Clusters</text>
    <text x="592" y="82" fill="#f8fafc" class="sans" font-size="22" font-weight="700">NVIDIA NIM 550B</text>
    <text x="592" y="108" fill="#e2e8f0" class="sans" font-size="18" font-weight="600">Groq LPU 120B / 20B</text>
    <text x="592" y="132" fill="#a855f7" class="mono" font-size="12">P50 Latency &amp; Tok/s</text>

    <!-- Card 4: Domain Splits -->
    <rect x="852" y="0" width="268" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="876" y="42" fill="#34d399" class="sans" font-size="15" font-weight="600" text-transform="uppercase" letter-spacing="1px">Systems Domains</text>
    <text x="876" y="72" fill="#cbd5e1" class="mono" font-size="13">• CUDA / TensorRT Host</text>
    <text x="876" y="94" fill="#cbd5e1" class="mono" font-size="13">• ARM C11 MMIO (W1C)</text>
    <text x="876" y="116" fill="#cbd5e1" class="mono" font-size="13">• Modern C++17 Pybind11</text>
    <text x="876" y="138" fill="#cbd5e1" class="mono" font-size="13">• S2 Geodesy &amp; WGS84</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(80, 560)">
    <text x="0" y="24" fill="#64748b" class="sans" font-size="16">
      Author: <tspan fill="#f1f5f9" font-weight="600">Lalit Chauhan</tspan> (@La1itchauhan)
    </text>
    <text x="480" y="24" fill="#64748b" class="mono" font-size="14">
      HF: huggingface.co/datasets/La1itchauhan/Nemotron-3-Ultra-550B-Systems-CoT
    </text>
    <text x="1050" y="24" fill="#38bdf8" class="mono" font-size="14" font-weight="600">
      v1.0.0 Live
    </text>
  </g>
</svg>
